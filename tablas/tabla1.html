<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>primera tabla</title>
</head>
<body>
    <h1>Mis primeras tablas</h1>
    <p>aqui hay un ejemplo de mi primera tabla:</p>
    <table>
        <tr>
            <th>Posición</th>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>
        <tr>
            <td rowspan="2">1º</td>
            <td>Noa Mahanaim</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Jonathan Salazar</td>
            <td>11</td>
        </tr>
    </table>
</body>
</html>
