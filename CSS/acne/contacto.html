    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html"><b>Inicio</b></a></li>
                <li><a href="contacto.html"><b>Contacto</b></a></li>

        <h1>EMPRESA ACNE</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>formulario de contacto</legend>
                <label for="nombre">introduzca su nombre:</label><br>
                <input type="text" name="nombre" id="nombre" placeholder="escriba nombre y apellidos"><br>
                <label for="email">introduzca su correo:</label><br>
                <input type="email" name="email" id="email" placeholder="escriba su correo"><br>
                <label for="tel">introduzca su telefono:</label> <br>
                <input type="tel" id="tel" name="tel" placeholder="escriba su teléfono"> <br> <br>
                <label for="texto">Aqui puede escribir su solicitud</label> <br> <br>
                <textarea rows="5" cols="53">Por favor, escriba aquí</textarea> <br>
                <input type="checkbox" name="politica" value="politicaSeguridad"> acepto las políticas de seguridad<br><br>
                <input type="submit"> 
                <input type="reset">
            </fieldset>
        </form>
    </main>
</body>
</html>
